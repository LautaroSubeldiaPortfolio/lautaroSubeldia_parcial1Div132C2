<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcial 1</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <header>
        <h1>Parcial 1 - División 132</h1>
    </header>

    <main>
        <h2 id="titulo-users">Users</h2>
        <hr>

        <div class="controles">
            <div class="izquierda">
                <div class="filtros">
                    <label><input type="radio" name="estado" checked> Active</label>
                    <label><input type="radio" name="estado"> Inactive</label>
                    <label><input type="radio" name="estado"> All</label>
                </div>

                <div class="botones">
                    <button class="btn">CREATE</button>
                    <button class="btn apagado">DEACTIVATE</button>
                    <button class="btn apagado">RESET PASSWORD</button>
                </div>
            </div>

            <input type="search" id="buscador" placeholder="Search Users">
        </div>

        <div id="users-container"></div>
    </main>

    <footer>
        <p>Lautaro Subeldia</p>
    </footer>
</body>
</html>
